name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - name: Lint Decision Quality SDK
        run: ruff check src/thinking_patterns/core/decision_compiler.py src/thinking_patterns/cli.py tests
      - name: Typecheck Decision Quality SDK
        run: mypy src/thinking_patterns/core/decision_compiler.py src/thinking_patterns/cli.py
      - name: Run tests
        run: pytest -q
      - name: Smoke test CLI gate
        run: decision-compile examples/decisions/pricing_raise.json --require-ready --compact
