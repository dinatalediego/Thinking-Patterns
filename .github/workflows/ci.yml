name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - name: Lint new decision compiler
        run: ruff check src/thinking_patterns/core/decision_compiler.py tests
      - name: Typecheck new decision compiler
        run: mypy src/thinking_patterns/core/decision_compiler.py
      - name: Run tests
        run: pytest -q
